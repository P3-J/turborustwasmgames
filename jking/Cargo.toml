[package]
name = "jking"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.6.1"
bevy = { version = "0.18.1", features = ["dynamic_linking"] }
bevy_trenchbroom = {version = "0.13.0", features = ["avian_f32"]}
rand = "0.9"
bevy_flycam = "*"
bevy-inspector-egui = "*"


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
